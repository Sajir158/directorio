<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Monitoreo Solar</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f3f6f9;
    color:#1e293b;
    padding:25px;
}

/* =========================================
CONTENEDOR
========================================= */

.container{
    max-width:1200px;
    margin:auto;
}

/* =========================================
HEADER
========================================= */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
    flex-wrap:wrap;
    gap:20px;
}

.header h1{
    font-size:30px;
    font-weight:600;
}

.subtitle{
    color:#64748b;
    margin-top:5px;
    font-size:14px;
}

/* =========================================
ESTADO
========================================= */

.status{
    background:white;
    border:1px solid #dbe2ea;
    border-radius:12px;
    padding:12px 18px;
    display:flex;
    align-items:center;
    gap:10px;
}

.led{
    width:14px;
    height:14px;
    border-radius:50%;
    background:#dc2626;
    transition:0.3s;
}

/* =========================================
CARDS
========================================= */

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:18px;
    margin-bottom:25px;
}

.cardInfo{
    background:white;
    border-radius:14px;
    border:1px solid #dbe2ea;
    padding:22px;
}

.cardTitle{
    color:#64748b;
    font-size:14px;
    margin-bottom:12px;
}

.cardValue{
    font-size:34px;
    font-weight:600;
}

.unit{
    font-size:18px;
    color:#64748b;
}

/* =========================================
GRAFICA
========================================= */

.chartCard{
    background:white;
    border-radius:16px;
    border:1px solid #dbe2ea;
    padding:25px;
}

.chartTop{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    flex-wrap:wrap;
    gap:15px;
}

.chartTop h2{
    font-size:24px;
    font-weight:600;
}

/* =========================================
BOTONES
========================================= */

.buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.buttons button{
    border:none;
    background:#e2e8f0;
    color:#1e293b;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    transition:0.2s;
    font-size:14px;
}

.buttons button:hover{
    background:#cbd5e1;
}

.buttons .active{
    background:#f59e0b;
    color:white;
}

/* =========================================
VALOR ACTUAL
========================================= */

.currentValue{
    margin-top:20px;
    font-size:17px;
    color:#475569;
}

#valorActual{
    font-weight:600;
    color:#0f172a;
}

/* =========================================
CANVAS
========================================= */

canvas{
    width:100% !important;
    height:430px !important;
}

/* =========================================
RESPONSIVE
========================================= */

@media(max-width:700px){

    body{
        padding:15px;
    }

    .header{
        flex-direction:column;
        align-items:flex-start;
    }

    .chartTop{
        flex-direction:column;
        align-items:flex-start;
    }

    .buttons{
        width:100%;
    }

    .buttons button{
        flex:1;
    }

}

</style>

</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <div>

            <h1>Monitoreo Solar</h1>

            <div class="subtitle">
                Supervisión del sistema fotovoltaico
            </div>

        </div>

        <div class="status">

            <div class="led" id="led"></div>

            <span id="estado">
                Sistema apagado
            </span>

        </div>

    </div>

    <!-- CARDS -->

    <div class="grid">

        <div class="cardInfo">

            <div class="cardTitle">
                Voltaje
            </div>

            <div class="cardValue">

                <span id="voltajeCard">
                    0
                </span>

                <span class="unit">
                    V
                </span>

            </div>

        </div>

        <div class="cardInfo">

            <div class="cardTitle">
                Corriente
            </div>

            <div class="cardValue">

                <span id="corrienteCard">
                    0
                </span>

                <span class="unit">
                    A
                </span>

            </div>

        </div>

        <div class="cardInfo">

            <div class="cardTitle">
                Potencia
            </div>

            <div class="cardValue">

                <span id="potenciaCard">
                    0
                </span>

                <span class="unit">
                    W
                </span>

            </div>

        </div>

    </div>

    <!-- GRAFICA -->

    <div class="chartCard">

        <div class="chartTop">

            <h2 id="tituloGrafica">
                Voltaje
            </h2>

            <div class="buttons">

                <button
                    id="btnVoltaje"
                    class="active"
                    onclick="cambiarVariable('voltaje')">

                    Voltaje

                </button>

                <button
                    id="btnCorriente"
                    onclick="cambiarVariable('corriente')">

                    Corriente

                </button>

                <button
                    id="btnPotencia"
                    onclick="cambiarVariable('potencia')">

                    Potencia

                </button>

            </div>

        </div>

        <canvas id="grafica"></canvas>

        <div class="currentValue">

            Valor actual:
            <span id="valorActual">
                0
            </span>

        </div>

    </div>

</div>

<script>

let variableActual = "voltaje";

const history = {

    time: [],
    voltaje: [],
    corriente: [],
    potencia: []

};

const MAX_PUNTOS = 60;

const ctx = document
.getElementById("grafica")
.getContext("2d");

const chart = new Chart(ctx, {

    type: "line",

    data: {

        labels: [],

        datasets: [{

            label: "Voltaje",

            data: [],

            borderColor: "#f59e0b",

            backgroundColor: "rgba(245,158,11,0.12)",

            borderWidth: 2,

            tension:0.25,

            fill:true,

            pointRadius:2

        }]
    },

    options: {

        responsive:true,

        maintainAspectRatio:false,

        animation:false,

        plugins:{

            legend:{
                display:true
            }

        },

        scales:{

            x:{

                grid:{
                    color:"#eef2f7"
                }

            },

            y:{

                beginAtZero:true,

                grid:{
                    color:"#eef2f7"
                }

            }

        }

    }

});

function cambiarVariable(variable){

    variableActual = variable;

    document
    .getElementById("tituloGrafica")
    .innerHTML =
    variable.charAt(0).toUpperCase() +
    variable.slice(1);

    document
    .getElementById("btnVoltaje")
    .classList.remove("active");

    document
    .getElementById("btnCorriente")
    .classList.remove("active");

    document
    .getElementById("btnPotencia")
    .classList.remove("active");

    if(variable === "voltaje"){

        document
        .getElementById("btnVoltaje")
        .classList.add("active");

        chart.data.datasets[0].borderColor =
        "#f59e0b";

        chart.data.datasets[0].backgroundColor =
        "rgba(245,158,11,0.12)";
    }

    if(variable === "corriente"){

        document
        .getElementById("btnCorriente")
        .classList.add("active");

        chart.data.datasets[0].borderColor =
        "#16a34a";

        chart.data.datasets[0].backgroundColor =
        "rgba(22,163,74,0.12)";
    }

    if(variable === "potencia"){

        document
        .getElementById("btnPotencia")
        .classList.add("active");

        chart.data.datasets[0].borderColor =
        "#2563eb";

        chart.data.datasets[0].backgroundColor =
        "rgba(37,99,235,0.12)";
    }

    actualizarGrafica();

}

function actualizarGrafica(){

    chart.data.labels = history.time;

    chart.data.datasets[0].data =
    history[variableActual];

    chart.data.datasets[0].label =
    variableActual;

    chart.update();

    const voltaje =
    history.voltaje[
        history.voltaje.length - 1
    ] || 0;

    const corriente =
    history.corriente[
        history.corriente.length - 1
    ] || 0;

    const potencia =
    history.potencia[
        history.potencia.length - 1
    ] || 0;

    document
    .getElementById("voltajeCard")
    .innerHTML =
    voltaje.toFixed(1);

    document
    .getElementById("corrienteCard")
    .innerHTML =
    corriente.toFixed(2);

    document
    .getElementById("potenciaCard")
    .innerHTML =
    potencia.toFixed(1);

    let unidad = "";

    if(variableActual === "voltaje"){
        unidad = " V";
    }

    if(variableActual === "corriente"){
        unidad = " A";
    }

    if(variableActual === "potencia"){
        unidad = " W";
    }

    const actual =
    history[variableActual][
        history[variableActual].length - 1
    ] || 0;

    document
    .getElementById("valorActual")
    .innerHTML =
    actual.toFixed(2) + unidad;

    if(potencia > 0){

        document
        .getElementById("led")
        .style.background =
        "#16a34a";

        document
        .getElementById("estado")
        .innerHTML =
        "Sistema operando";

    }else{

        document
        .getElementById("led")
        .style.background =
        "#dc2626";

        document
        .getElementById("estado")
        .innerHTML =
        "Sistema apagado";

    }

}

async function obtenerDatos(){

    try{

        const response =
        await fetch("/history");

        if(!response.ok){
            return;
        }

        const data =
        await response.json();

        history.time =
        (data.time || []).slice(-MAX_PUNTOS);

        history.voltaje =
        (data.voltaje || []).slice(-MAX_PUNTOS);

        history.corriente =
        (data.corriente || []).slice(-MAX_PUNTOS);

        history.potencia =
        (data.potencia || []).slice(-MAX_PUNTOS);

        actualizarGrafica();

    }catch(error){

        console.log(error);

    }

}

setInterval(obtenerDatos,60000);

obtenerDatos();

</script>

</body>
</html>
